# ASTRA-sim matrix: LLM-v1 | MoE-v1  ×  Ring | Rail | Torus
# Default communication scheduler: NCCL
#
# Build once:
#   docker compose build
#
# Examples:
#   docker compose run --rm llm-rail
#   docker compose run --rm moe-ring
#   docker compose run --rm llm-torus
#   SCHEDULER=baseline docker compose run --rm moe-rail
#
# Or one-shot with env overrides:
#   docker compose run --rm -e WORKLOAD=moe-v1 -e TOPOLOGY=torus matrix

x-astra-sim-common: &astra-sim-common
  image: moe-rail-astra-sim:phase-c
  working_dir: /workspace
  volumes:
    - ./:/workspace
  mem_limit: 4g
  memswap_limit: 4g
  shm_size: 512m
  environment: &astra-env
    GENERATE: ${GENERATE:-1}
    SCHEDULER: ${SCHEDULER:-nccl}
    ASTRA_SIM_HOME: /opt/astra-sim
    PYTHONPATH: /workspace

services:
  # Generic (override WORKLOAD / TOPOLOGY / SCHEDULER)
  matrix:
    <<: *astra-sim-common
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ASTRA_SIM_REF: master
    environment:
      <<: *astra-env
      WORKLOAD: ${WORKLOAD:-llm-v1}
      TOPOLOGY: ${TOPOLOGY:-rail}

  # --- LLM-v1 ---
  llm-ring:
    <<: *astra-sim-common
    environment:
      <<: *astra-env
      WORKLOAD: llm-v1
      TOPOLOGY: ring

  llm-rail:
    <<: *astra-sim-common
    environment:
      <<: *astra-env
      WORKLOAD: llm-v1
      TOPOLOGY: rail

  llm-torus:
    <<: *astra-sim-common
    environment:
      <<: *astra-env
      WORKLOAD: llm-v1
      TOPOLOGY: torus

  # --- MoE-v1 ---
  moe-ring:
    <<: *astra-sim-common
    environment:
      <<: *astra-env
      WORKLOAD: moe-v1
      TOPOLOGY: ring

  moe-rail:
    <<: *astra-sim-common
    environment:
      <<: *astra-env
      WORKLOAD: moe-v1
      TOPOLOGY: rail

  moe-torus:
    <<: *astra-sim-common
    environment:
      <<: *astra-env
      WORKLOAD: moe-v1
      TOPOLOGY: torus

# 3D Torus, 16 GPUs/NPUs (4 x 2 x 2) — same baseline unit count as Ring/Rail
#
# ASTRA-sim has no "Torus" keyword: a torus is a stack of Ring dimensions.
# Docs/experiments may say "GPU"; Astra-SIM still uses npus_count.
# NPU id -> coordinates:  x = id % 4,  y = (id / 4) % 2,  z = id / 8

topology: [ Ring, Ring, Ring ]
npus_count: [ 4, 2, 2 ]           # 16 units total
bandwidth: [ 50.0, 50.0, 50.0 ]   # GB/s per link, per direction
latency: [ 500.0, 500.0, 500.0 ]  # ns per hop
